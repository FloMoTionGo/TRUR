name: daily-challenge

# Picks the pairs for today and tomorrow (UTC) and commits data/daily_challenges.json.
# The backend imports that file; if a run fails, its fallback covers the day (docs/test-strategy.md §7).

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the picks, commit nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-challenge
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Pick missing pairs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m scripts.pick_daily --dry-run
          else
            python -m scripts.pick_daily
          fi
      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- data/daily_challenges.json; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_challenges.json
          git commit -m "chore: daily pairs"
          git pull --rebase
          git push
