name: phones-webkit

# Weekly: the phone layout cases in WebKit on two devices (docs/test-strategy.md §7). Linux WebKit isn't
# iOS Safari, but it catches CSS that only Chromium accepts.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m playwright install --with-deps webkit
      - name: Layout cases in WebKit
        run: >-
          pytest -q -m mobile --browser webkit --devices=se-bars,promax
          -k "p3_3 or p4_1 or p6_1 or p6_2 or p8_1"
          --tracing retain-on-failure --output test-results
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-traces-webkit
          path: test-results
          retention-days: 7
