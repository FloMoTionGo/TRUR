name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Pacific/Kiritimati  # UTC+14: any leftover local-time call gives the wrong date
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Tests
        run: pytest -q -m "not e2e and not smoke" --cov --cov-fail-under=85
      - name: No database files in git (S9)
        run: test -z "$(git ls-files '*.db' 'var/')"
      - name: Dependency audit (S12)
        run: pip-audit -r requirements.txt
