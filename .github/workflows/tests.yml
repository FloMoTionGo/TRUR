name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Pacific/Kiritimati  # UTC+14: any leftover local-time call gives the wrong date
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Tests
        run: pytest -q -m "not e2e and not smoke" --cov --cov-fail-under=85
      - name: Daily pick dry run on the real data
        run: python -m scripts.pick_daily --dry-run
      - name: No database files in git (S9)
        run: test -z "$(git ls-files '*.db' 'var/')"
      - name: Dependency audit (S12)
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the image
        run: docker build -t trur .
      - name: Only the app is in the image (S9)
        run: docker run --rm trur sh -c 'test ! -e tests && test ! -e var && test ! -e .git && ! find / -xdev -name "*.db" | grep -q .'
      - name: The container serves /healthz
        run: |
          docker run -d --name trur -p 8080:8080 -e DAILY_JSON_SOURCE=/app/data/daily_challenges.json trur
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs trur
          exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser flows
        run: pytest -q -m "e2e and not mobile" --tracing retain-on-failure --output test-results
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  # The phone cases (docs/test-strategy.md §7) on every device of tests/e2e/devices.py that they run on,
  # one job per device so the push stays under 5 minutes.
  e2e-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        device: [env-corner, s360, w320, se, se-bars, ip17-bars, px, promax]
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Phone cases
        run: pytest -q -m mobile --devices="$DEVICE" --tracing retain-on-failure --output test-results
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-traces-${{ matrix.device }}
          path: test-results
          retention-days: 7
