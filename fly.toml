# Fly.io app (docs/architecture.md §5). Deploys are manual: `fly deploy` from the repo root.
app = "trur"
primary_region = "fra"

[env]
  DATA_DIR = "/data"
  DAILY_JSON_SOURCE = "https://raw.githubusercontent.com/FloMoTionGo/TRUR/main/data/daily_challenges.json"
  ALLOWED_ORIGINS = "https://trur.fly.dev"
  COOKIE_SECURE = "1"
  HSTS = "1"
  TRUST_FLY_CLIENT_IP = "1"
  DEBUG = "0"

[mounts]
  source = "trur_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
