    <g font-size="26">
      <text x="100" y="100" fill="#1E1E1E">TR</text><text x="180" y="100" fill="#FFFFFF">UR</text>
      <text x="100" y="180" fill="#FFFFFF">TR</text><text x="180" y="180" fill="#1E1E1E">UR</text>
    </g>
  </g>
